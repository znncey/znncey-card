<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сейдамет Исмаилов — SEO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0b0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      padding: 50px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(125, 70, 255, 0.18), transparent 35%),
        #0b0b0f;
    }

    .logo {
      width: 72px;
      height: 72px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -2px;
      background: rgba(255,255,255,0.03);
      box-shadow: 0 0 35px rgba(130, 80, 255, 0.15);
    }

    .seo {
      color: #a678ff;
      font-size: 13px;
      letter-spacing: 5px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 35px;
    }

    .balance-box {
      width: 100%;
      padding: 22px 20px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      box-shadow: 0 15px 50px rgba(0,0,0,0.25);
    }

    .balance-label {
      font-size: 10px;
      letter-spacing: 3px;
      opacity: 0.45;
      margin-bottom: 8px;
    }

    #balance {
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -1px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #balance.changing {
      opacity: 0.35;
      transform: scale(0.96);
    }

    .live {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 2px;
      opacity: 0.35;
    }

    .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: #a678ff;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
      box-shadow: 0 0 8px #a678ff;
    }

    .footer {
      position: absolute;
      bottom: 25px;
      font-size: 10px;
      opacity: 0.25;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">S·C</div>

    <div class="seo">SEO</div>

    <h1>Сейдамет Исмаилов</h1>

    <div class="balance-box">
      <div class="balance-label">BALANCE</div>

      <div id="balance">$97.00</div>

      <div class="live">
        <span class="dot"></span>LIVE
      </div>
    </div>

    <div class="footer">
      ZNNCEY
    </div>

  </main>

  <script>
    const balance = document.getElementById("balance");

    function updateBalance() {
      balance.classList.add("changing");

      setTimeout(() => {

        // Случайная сумма от $80 до $120
        const amount = 80 + Math.random() * 40;

        balance.textContent = "$" + amount.toFixed(2);

        balance.classList.remove("changing");

      }, 250);
    }

    // Обновление каждую секунду
    setInterval(updateBalance, 1000);
  </script>

</body>
</html>
