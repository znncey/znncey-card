<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сейдамет Исмаилов — CEO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      min-height: 700px;
      background: linear-gradient(145deg, #111111, #050505);
      border: 1px solid #292929;
      border-radius: 28px;
      padding: 42px 26px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top {
      text-align: center;
    }

    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      border: 1px solid #444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 2px;
      background: #0b0b0b;
    }

    h1 {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 9px;
    }

    .position {
      color: #8f8f8f;
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .line {
      width: 55px;
      height: 1px;
      background: #555;
      margin: 30px auto;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: white;
      background: #111;
      border: 1px solid #303030;
      border-radius: 15px;
      padding: 17px 19px;
      transition: 0.2s;
    }

    .button:hover {
      background: #1c1c1c;
      transform: translateY(-1px);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon {
      width: 25px;
      text-align: center;
      font-size: 19px;
    }

    .label {
      font-size: 16px;
      font-weight: 500;
    }

    .arrow {
      color: #777;
      font-size: 18px;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      color: #555;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .name-small {
      color: #777;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="top">

      <div class="logo">SI</div>

      <h1>Сейдамет Исмаилов</h1>

      <div class="position">CEO</div>

      <div class="line"></div>

    </div>

    <div class="buttons">

      <!-- Instagram -->
      <a class="button"
         href="https://instagram.com/znncey"
         target="_blank">
        <div class="left">
          <div class="icon">◎</div>
          <div class="label">@znncey</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <!-- Telegram -->
      <a class="button"
         href="https://t.me/znncey"
         target="_blank">
        <div class="left">
          <div class="icon">➤</div>
          <div class="label">t.me/znncey</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <!-- Phone -->
      <a class="button"
         href="tel:+998200022252">
        <div class="left">
          <div class="icon">⌕</div>
          <div class="label">+998 20 002 22 52</div>
        </div>
        <div class="arrow">›</div>
      </a>

    </div>

    <div class="footer">
      <div class="name-small">SEYDA ISMAILOV</div>
      DIGITAL BUSINESS CARD
    </div>

  </div>

</body>
</html>
