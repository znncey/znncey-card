<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сейдамет Исмаилов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 15%, #24113d 0%, #0d0715 30%, #030305 70%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
    }
    .ceo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 6px;
      color: #b77cff;
      margin-bottom: 16px;
      text-shadow: 0 0 18px rgba(170, 90, 255, 0.35);
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .line {
      width: 45px;
      height: 1px;
      background: #9b4dff;
      margin: 0 auto 15px;
      box-shadow: 0 0 12px rgba(155, 77, 255, 0.55);
    }
    .subtitle {
      color: #806a94;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 38px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .link {
      height: 60px;
      border: 1px solid #291a38;
      border-radius: 13px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      text-decoration: none;
      color: #fff;
      background: rgba(12, 8, 17, 0.88);
      transition: all 0.25s ease;
    }
    .link:hover {
      transform: translateY(-2px);
      border-color: #8f45dc;
      background: rgba(27, 13, 39, 0.95);
      box-shadow: 0 8px 28px rgba(145, 65, 220, 0.15);
    }
    .icon {
      width: 30px;
      font-size: 19px;
      color: #b66cff;
      text-shadow: 0 0 10px rgba(175, 90, 255, 0.35);
    }
    .text {
      flex: 1;
      text-align: center;
      margin-right: 30px;
      font-size: 14px;
      letter-spacing: 1px;
      color: #eee7f5;
    }
    .arrow {
      color: #71458f;
      font-size: 18px;
    }
    .footer {
      margin-top: 35px;
      color: #382544;
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="ceo">CEO</div>
    <h1>Сейдамет Исмаилов</h1>
    <div class="line"></div>
    <div class="subtitle">
      Personal Card
    </div>
    <div class="links">
      <a class="link"
         href="https://instagram.com/znncey"
         target="_blank">
        <div class="icon">◎</div>
        <div class="text">Instagram</div>
        <div class="arrow">›</div>
      </a>
      <a class="link"
         href="https://t.me/znncey"
         target="_blank">
        <div class="icon">✈</div>
        <div class="text">Telegram</div>
        <div class="arrow">›</div>
      </a>
      <a class="link"
         href="tel:+998200022252">
        <div class="icon">☎</div>
        <div class="text">+998 20 002 22 52</div>
        <div class="arrow">›</div>
      </a>
    </div>
    <div class="footer">
      Digital Card
    </div>
  </main>
</body>
</html>
