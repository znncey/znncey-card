<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сейдамет Исмаилов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: #050505;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    /* Мягкое фиолетовое свечение */
    body::before {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      top: -240px;
      left: 50%;
      transform: translateX(-50%);
      background: #6d28d9;
      opacity: 0.10;
      filter: blur(130px);
      border-radius: 50%;
      pointer-events: none;
    }
    .card {
      width: 90%;
      max-width: 430px;
      position: relative;
    }
    /* Верхняя часть */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 70px;
    }
    .brand {
      font-size: 11px;
      letter-spacing: 5px;
      color: #8f8f8f;
    }
    .number {
      font-size: 10px;
      color: #444;
      letter-spacing: 2px;
    }
    /* Главный блок */
    .hero {
      margin-bottom: 55px;
    }
    .role {
      font-size: 12px;
      letter-spacing: 8px;
      color: #a970ff;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(160, 90, 255, 0.35);
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -1px;
      margin-bottom: 22px;
    }
    .description {
      color: #6f6f6f;
      font-size: 12px;
      letter-spacing: 2px;
      line-height: 1.8;
    }
    /* Фиолетовый акцент */
    .accent {
      width: 42px;
      height: 1px;
      background: #8b5cf6;
      margin-top: 28px;
      box-shadow: 0 0 14px rgba(139, 92, 246, 0.65);
    }
    /* Контакты */
    .contacts {
      border-top: 1px solid #191919;
    }
    .contact {
      height: 65px;
      border-bottom: 1px solid #191919;
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #fff;
      transition: 0.25s ease;
    }
    .contact:hover {
      padding-left: 8px;
      border-color: #39205a;
    }
    .symbol {
      width: 35px;
      color: #9b6cff;
      font-size: 16px;
    }
    .name {
      flex: 1;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #d8d8d8;
    }
    .value {
      font-size: 11px;
      color: #555;
      letter-spacing: 0.5px;
    }
    .arrow {
      margin-left: 14px;
      color: #7148a5;
      font-size: 17px;
    }
    /* Низ */
    .bottom {
      display: flex;
      justify-content: space-between;
      margin-top: 38px;
    }
    .bottom span {
      font-size: 8px;
      letter-spacing: 3px;
      color: #303030;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="top">
      <div class="brand">ZN NCEY</div>
      <div class="number">01 / 01</div>
    </div>
    <section class="hero">
      <div class="role">CEO</div>
      <h1>
        Сейдамет<br>
        Исмаилов
      </h1>
      <div class="description">
        PERSONAL IDENTITY<br>
        DIGITAL BUSINESS CARD
      </div>
      <div class="accent"></div>
    </section>
    <section class="contacts">
      <a class="contact"
         href="https://instagram.com/znncey"
         target="_blank">
        <div class="symbol">◎</div>
        <div class="name">Instagram</div>
        <div class="value">@znncey</div>
        <div class="arrow">›</div>
      </a>
      <a class="contact"
         href="https://t.me/znncey"
         target="_blank">
        <div class="symbol">↗</div>
        <div class="name">Telegram</div>
        <div class="value">@znncey</div>
        <div class="arrow">›</div>
      </a>
      <a class="contact"
        href="tel:+998200022252">
        <div class="symbol">＋</div>
        <div class="name">Phone</div>
        <div class="value">+998 20 002 22 52</div>
        <div class="arrow">›</div>
      </a>
    </section>
    <div class="bottom">
      <span>Digital Card</span>
      <span>2026</span>
    </div>
  </main>
</body>
</html>
<div class="live-balance">
  <div class="balance-label">DEMO BALANCE</div>
  <div id="balance">$247.38</div>
</div>
<style>
  .live-balance {
    text-align: center;
    margin: 10px auto;
    font-family: Arial, sans-serif;
  }
  .balance-label {
    font-size: 7px;
    letter-spacing: 1.8px;
    opacity: 0.4;
    margin-bottom: 3px;
  }
  #balance {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.3px;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #balance.changing {
    opacity: 0.45;
    transform: scale(0.98);
  }
</style>
<script>
  const balance = document.getElementById("balance");
  let amount = 247.38;
  function updateBalance() {
    balance.classList.add("changing");
    setTimeout(() => {
      // Небольшое изменение вверх или вниз
      const change = Math.random() * 8 - 4;
      amount += change;
      // Диапазон от $80 до $600
      amount = Math.max(80, Math.min(600, amount));
      balance.textContent = "$" + amount.toFixed(2);
      balance.classList.remove("changing");
    }, 200);
  }
  // Обновление каждую секунду
  setInterval(updateBalance, 1000);
</script>
<!-- DEMO TRADING CHART -->
<div id="tradingChart" class="trading-chart">
  <div class="chart-header">
    <span>DEMO MARKET</span>
    <button onclick="closeChart()">×</button>
  </div>
  <div class="chart-price" id="chartPrice">$247.38</div>
  <div class="candles" id="candles"></div>
  <div class="chart-footer">
    <span>1H</span>
    <span>4H</span>
    <span>1D</span>
  </div>
</div>
<style>
  .trading-chart {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 390px;
    padding: 18px;
    border-radius: 20px;
    background: #101014;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 70px rgba(0,0,0,.55);
    z-index: 9999;
    animation: chartIn .25s ease;
  }
  @keyframes chartIn {
    from {
      opacity: 0;
      transform: translate(-50%, 15px);
    }
    to {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  }
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: rgba(255,255,255,.55);
    font-size: 9px;
    letter-spacing: 2px;
  }
  .chart-header button {
    border: 0;
    background: transparent;
    color: white;
    font-size: 22px;
    cursor: pointer;
  }
  .chart-price {
    margin-top: 10px;
    font-size: 25px;
    font-weight: 500;
  }
  .candles {
    height: 145px;
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
    overflow: hidden;
  }
  .candle {
    position: relative;
    width: 7px;
    height: 35px;
    border-radius: 2px;
  }
  .candle::before {
    content: "";
    position: absolute;
    width: 1px;
    height: 100%;
    left: 3px;
    top: -15px;
    background: currentColor;
  }
  .green {
    background: #54d68b;
    color: #54d68b;
  }
  .red {
    background: #e96b78;
    color: #e96b78;
  }
  .chart-footer {
    display: flex;
    gap: 18px;
    margin-top: 12px;
    font-size: 9px;
    opacity: .4;
  }
</style>
<script>
  const tradingChart = document.getElementById("tradingChart");
  const chartPrice = document.getElementById("chartPrice");
  const candles = document.getElementById("candles");
  function openChart() {
    tradingChart.style.display = "block";
    createCandles();
  }
  function closeChart() {
    tradingChart.style.display = "none";
  }
  function createCandles() {
    candles.innerHTML = "";
    for (let i = 0; i < 32; i++) {
      const candle = document.createElement("div");
      candle.className =
        "candle " + (Math.random() > 0.5 ? "green" : "red");
      const height = 20 + Math.random() * 65;
      candle.style.height = height + "px";
      candles.appendChild(candle);
    }
    chartPrice.textContent =
      "$" + (80 + Math.random() * 520).toFixed(2);
  }
  // Нажатие на DEMO BALANCE
  document.querySelector(".live-balance")
    .addEventListener("click", openChart);
</script>
