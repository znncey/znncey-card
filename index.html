<div class="live-balance">
  <div class="balance-label">LIVE BALANCE</div>
  <div id="balance">$97.00</div>
</div>

<style>
  .live-balance {
    text-align: center;
    margin: 25px auto;
    font-family: Arial, sans-serif;
  }

  .balance-label {
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0.55;
    margin-bottom: 6px;
  }

  #balance {
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -1px;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  #balance.changing {
    opacity: 0.35;
    transform: scale(0.97);
  }
</style>

<script>
  const balance = document.getElementById("balance");

  function updateBalance() {
    balance.classList.add("changing");

    setTimeout(() => {
      // Случайная сумма от $80 до $120
      const amount = 80 + Math.random() * 40;

      balance.textContent = "$" + amount.toFixed(2);

      balance.classList.remove("changing");
    }, 250);
  }

  // Меняет сумму каждую секунду
  setInterval(updateBalance, 1000);
</script>
